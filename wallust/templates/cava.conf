[general]
framerate = 60
autosens = 1
bars = 0
bar_width = 2
bar_spacing = 1

[input]
method = pulse
source = auto

[output]
method = noncurses
channels = stereo
mono_option = average

[color]
gradient = 1
gradient_count = 8
gradient_color_1 = '{{color1}}'
gradient_color_2 = '{{color9}}'
gradient_color_3 = '{{color3}}'
gradient_color_4 = '{{color11}}'
gradient_color_5 = '{{color4}}'
gradient_color_6 = '{{color12}}'
gradient_color_7 = '{{color6}}'
gradient_color_8 = '{{color14}}'

[smoothing]
noise_reduction = 55
monstercat = 1
waves = 0