
# -------------------------
# VARIABLES
# -------------------------

# $mainMod = SUPER
$mainMod = ALT


# -------------------------
# KEYBINDS
# -------------------------

# quick launch app
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, $filemanager
bind = $mainMod, B, exec, $browser
bind = $mainMod, C, exec, code
bind = $mainMod, M, exec, wlogout
bind = $mainMod, N, exec, ~/Applications/Obsidian.AppImage --no-sandbox
bind = $mainMod, A, exec, flatpak run com.spotify.Client

bind = $mainMod SHIFT, W, exec, waypaper

# scripts 
bind = $mainMod, W, exec, ~/.config/hypr/scripts/random-wallpaper.sh
bind = SUPER, P, exec, ~/.config/hypr/scripts/startup.sh

# windows
bind = $mainMod, Q, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, Y, pseudo # dwindle
# bind = $mainMod, T, layoutmsg, togglesplit # not working 

# move focus 
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move windows around
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Resize windows
binde = $mainMod CTRL, H, resizeactive, -50 0
binde = $mainMod CTRL, L, resizeactive, 50 0
binde = $mainMod CTRL, K, resizeactive, 0 -50
binde = $mainMod CTRL, J, resizeactive, 0 50

# special workspae
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod, U, movetoworkspace, special:magic

# workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# move active window to another workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# move + resize windows : resize not working rn
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# scroll through existing workspaces
bind = $mainMod, mouse_up, workspace, e+1
bind = $mainMod, mouse_down, workspace, e-1


# screenshot to clipboard
bind = $mainMod SHIFT, S, exec, grimblast copy area

# screenshot to file AND clipboard
bind = $mainMod CTRL, S, exec, grimblast copysave area ~/Pictures/Screenshot/screenshot-$(date +%F-%H%M%S).png

# MEDIA KEYS
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 2%+
bindel = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh up
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh down

