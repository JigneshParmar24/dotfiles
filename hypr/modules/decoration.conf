
# -------------------------
# GENERAL
# -------------------------

general {
    gaps_in = 7
    gaps_out = 14

    border_size = 1

    resize_on_border = true

    layout = dwindle
}

# -------------------------
# DECORATION
# -------------------------

decoration {
    # code ~/.config/hypr/shaders/brightness.glsl
    screen_shader = ~/.config/hypr/shaders/brightness.glsl

    rounding = 10
    rounding_power = 5

    active_opacity = 0.95
    # active_opacity = 1
    inactive_opacity = 1.0

    # shadow{
    #     enabled = true
    #     range = 4
    #     render_power = 3
    #     color = rgba(0a0a0add)
    # }

    # blur{
    #     enabled = true
    #     size = 3
    #     passes = 1
    #     vibrancy = 0.1696
    # }
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }
}
