windowrule {
    name = suppress-maximize-events

    match:class = .*

    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags

    match:xwayland = true
    match:float = true

    no_focus = true
}

# Floating Applications

windowrule {
    name = pavucontrol

    match:class = pavucontrol

    float = yes
    center = yes
}

windowrule {
    name = calculator

    match:class = qalculate-gtk

    float = yes
    center = yes
}

# Picture in Picture

windowrule {
    name = pip

    match:title = Picture in picture

    float = yes
    pin = yes
}

# Rofi

windowrule {
    name = rofi

    match:class = rofi

    float = yes
    center = yes
} 